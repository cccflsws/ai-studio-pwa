<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 視覺創作工作站</title>
  <style>
    body { margin: 0; font-family: Arial, "Noto Sans TC", sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; }
    label { display: block; color: #94a3b8; margin-bottom: 6px; font-size: 0.9rem; }
    input, textarea, select { width: 100%; box-sizing: border-box; background: #111827; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 1rem; margin-bottom: 10px; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button { background: #22c55e; color: #052e16; border: none; border-radius: 8px; padding: 12px 16px; font-weight: 700; cursor: pointer; flex: 1; }
    button.blue { background: #3b82f6; color: #fff; }
    #st { margin-top: 12px; color: #38bdf8; white-space: pre-wrap; word-break: break-all; }
    #pic img { max-width: 100%; border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>AI 視覺創作工作站</h2>
    <div class="box">
      <label for="comfyUrl">ComfyUI 雲端網址</label>
      <input id="comfyUrl" type="text" value="https://cocktail-cotton-committees-perhaps.trycloudflare.com" />

      <label for="p">畫面描述（英文較佳）</label>
      <textarea id="p">modern city skyline at sunset, warm golden light</textarea>

      <div class="btn-row">
        <button type="button" onclick="runPoll()">Pollinations 生圖</button>
        <button type="button" class="blue" onclick="testComfy()">測試 ComfyUI 連線</button>
      </div>

      <div id="st">尚未開始</div>
      <div id="pic"></div>
    </div>
  </div>

  <script>
    function testComfy() {
      var st = document.getElementById("st");
      var url = (document.getElementById("comfyUrl").value || "").trim().replace(/\/+$/, "");
      if (!url) { st.textContent = "請先輸入 ComfyUI 網址"; return; }
      st.textContent = "測試連線中：" + url + "/system_stats";
      fetch(url + "/system_stats")
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) {
          var gpu = (d && d.devices && d.devices[0] && d.devices[0].name) ? d.devices[0].name : "未知 GPU";
          st.textContent = "ComfyUI 連線成功！\n裝置：" + gpu;
        })
        .catch(function (e) {
          st.textContent = "連線失敗：" + e.message;
        });
    }

    function runPoll() {
      var st = document.getElementById("st");
      var pic = document.getElementById("pic");
      var prompt = (document.getElementById("p").value || "").trim();
      if (!prompt) { st.textContent = "請先輸入畫面描述"; return; }
      var seed = Math.floor(Math.random() * 1000000);
      var url = "https://gen.pollinations.ai/image/" + encodeURIComponent(prompt) + "?model=flux&width=1024&height=576&seed=" + seed + "&nologo=true";
      st.textContent = "生成中（Seed: " + seed + "）...";
      pic.innerHTML = '<img src="' + url + '" onload="document.getElementById(\'st\').textContent=\'生成完成！\'" onerror="document.getElementById(\'st\').textContent=\'載入失敗\'" />';
    }
  </script>
</body>
</html>
