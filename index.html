<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>AI 視覺創作工作站</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      line-height: 1.5;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h2 { margin-top: 0; margin-bottom: 12px; font-size: 1.35rem; }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    label { display: block; color: #94a3b8; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #111827;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    textarea { min-height: 82px; }
    .row-2 { display: flex; gap: 10px; flex-wrap: wrap; }
    .row-2 > div { flex: 1; min-width: 180px; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    button {
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      flex: 2;
      min-width: 160px;
    }
    button.secondary {
      background: #334155;
      color: #f8fafc;
      flex: 1;
      min-width: 120px;
    }
    .check-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .check-line input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    #st {
      margin-top: 12px;
      color: #38bdf8;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #pic img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid #334155;
    }
    .seed-info {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>AI 視覺創作工作站</h2>

    <div class="box">
      <label for="k">Pollinations API Key（自動保存在本機瀏覽器）</label>
      <input id="k" type="text" placeholder="貼上 API Key" oninput="savePrefs()" />

      <label for="p">畫面描述（建議使用英文）</label>
      <textarea id="p" oninput="savePrefs()">modern city skyline at sunset, warm golden light, cinematic composition</textarea>

      <label for="neg">排除元素（選填，英文）</label>
      <input id="neg" type="text" placeholder="例如：blurry, watermark, low quality" oninput="savePrefs()" />

      <div class="row-2">
        <div>
          <label for="m">模型</label>
          <select id="m" onchange="savePrefs()">
            <option value="flux">flux</option>
            <option value="zimage">zimage</option>
            <option value="turbo">turbo</option>
          </select>
        </div>

        <div>
          <label for="r">畫面比例</label>
          <select id="r" onchange="savePrefs()">
            <option value="1024x576">橫式 16:9 (1024x576)</option>
            <option value="768x1024">直式 3:4 (768x1024)</option>
            <option value="1024x1024">正方形 1:1 (1024x1024)</option>
            <option value="1280x720">高畫質橫式 (1280x720)</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div>
          <label for="seed">種子碼 Seed（留空或勾選隨機則自動產生）</label>
          <input id="seed" type="number" placeholder="例如 42" oninput="savePrefs()" />
        </div>
      </div>

      <div class="check-line">
        <input id="randSeed" type="checkbox" checked onchange="savePrefs()" />
        <label for="randSeed" style="margin:0; color:#cbd5e1; cursor:pointer;">每次產生自動換新 Seed（取消勾選可固定目前 Seed 微調）</label>
      </div>

      <div class="btn-row">
        <button type="button" onclick="runGen()">開始生成圖片</button>
        <button type="button" class="secondary" onclick="clearResult()">清除結果</button>
      </div>

      <div id="st">尚未開始</div>
      <div id="seedUsed" class="seed-info"></div>
      <div id="pic"></div>
    </div>
  </div>

  <script>
    function trimStr(s) {
      return (s || "").replace(/^\s+|\s+$/g, "");
    }

    function savePrefs() {
      try {
        localStorage.setItem("pwa_poll_key", trimStr(document.getElementById("k").value));
        localStorage.setItem("pwa_poll_prompt", document.getElementById("p").value);
        localStorage.setItem("pwa_poll_neg", document.getElementById("neg").value);
        localStorage.setItem("pwa_poll_model", document.getElementById("m").value);
        localStorage.setItem("pwa_poll_ratio", document.getElementById("r").value);
        localStorage.setItem("pwa_poll_seed", document.getElementById("seed").value);
        localStorage.setItem("pwa_poll_rand", document.getElementById("randSeed").checked ? "1" : "0");
      } catch (e) {}
    }

    function loadPrefs() {
      try {
        var k = localStorage.getItem("pwa_poll_key");
        var p = localStorage.getItem("pwa_poll_prompt");
        var neg = localStorage.getItem("pwa_poll_neg");
        var m = localStorage.getItem("pwa_poll_model");
        var r = localStorage.getItem("pwa_poll_ratio");
        var seed = localStorage.getItem("pwa_poll_seed");
        var rand = localStorage.getItem("pwa_poll_rand");

        if (k !== null && k !== "") document.getElementById("k").value = k;
        if (p !== null && p !== "") document.getElementById("p").value = p;
        if (neg !== null) document.getElementById("neg").value = neg;
        if (m) document.getElementById("m").value = m;
        if (r) document.getElementById("r").value = r;
        if (seed !== null) document.getElementById("seed").value = seed;
        if (rand !== null) document.getElementById("randSeed").checked = (rand === "1");
      } catch (e) {}
    }

    function clearResult() {
      document.getElementById("pic").innerHTML = "";
      document.getElementById("seedUsed").textContent = "";
      document.getElementById("st").textContent = "已清除結果，尚未開始";
    }

    function runGen() {
      var st = document.getElementById("st");
      var pic = document.getElementById("pic");
      var seedUsedEl = document.getElementById("seedUsed");

      savePrefs();

      var key = trimStr(document.getElementById("k").value);
      var prompt = trimStr(document.getElementById("p").value);
      var neg = trimStr(document.getElementById("neg").value);
      var model = document.getElementById("m").value;
      var dims = document.getElementById("r").value.split("x");
      var randChecked = document.getElementById("randSeed").checked;
      var seedInput = trimStr(document.getElementById("seed").value);
      var seedNum;

      if (!prompt) {
        st.textContent = "請先輸入畫面描述";
        return;
      }

      if (randChecked || !seedInput) {
        seedNum = Math.floor(Math.random() * 1000000);
        document.getElementById("seed").value = String(seedNum);
        savePrefs();
      } else {
        seedNum = parseInt(seedInput, 10);
        if (isNaN(seedNum)) {
          seedNum = Math.floor(Math.random() * 1000000);
        }
      }

      var fullPrompt = prompt;
      if (neg) {
        fullPrompt = fullPrompt + ", without " + neg;
      }

      var url = "https://gen.pollinations.ai/image/" + encodeURIComponent(fullPrompt) +
        "?model=" + encodeURIComponent(model) +
        "&width=" + dims[0] +
        "&height=" + dims[1] +
        "&seed=" + seedNum +
        "&nologo=true";

      if (key) {
        url = url + "&key=" + encodeURIComponent(key);
      }

      st.textContent = "正在生成圖片（模型：" + model + "，" + dims[0] + "x" + dims[1] + "）...";
      seedUsedEl.textContent = "本次使用 Seed：" + seedNum;
      pic.innerHTML = "";

      var img = new Image();
      img.onload = function () {
        st.textContent = "生成完成！";
        pic.innerHTML = '<img src="' + url + '" alt="生成圖片" />';
      };
      img.onerror = function () {
        st.textContent = "載入失敗（請檢查 API Key、額度、模型名稱或網路連線）。";
      };
      img.src = url;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    loadPrefs();
  </script>
</body>
</html>
