<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <title>AI 視覺創作工作站</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      line-height: 1.5;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    label { display: block; color: #94a3b8; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #111827;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    textarea { min-height: 80px; }
    button {
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    #status {
      margin-top: 10px;
      color: #38bdf8;
      font-size: 0.9rem;
      word-break: break-all;
    }
    #result img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🎨 AI 視覺創作工作站（除錯版）</h2>
    <div class="box">
      <label for="apiKey">Pollinations API Key</label>
      <input id="apiKey" type="password" placeholder="貼上你的 API Key" oninput="localStorage.setItem('poll_key', this.value.trim())" />

      <label for="prompt">畫面描述（英文）</label>
      <textarea id="prompt">modern city skyline at sunset</textarea>

      <label for="model">模型</label>
      <select id="model">
        <option value="flux">flux</option>
        <option value="zimage">zimage</option>
      </select>

      <label for="ratio">比例</label>
      <select id="ratio">
        <option value="1024x576">橫式 16:9 (1024x576)</option>
        <option value="768x1024">直式 3:4 (768x1024)</option>
        <option value="1024x1024">正方形 1:1 (1024x1024)</option>
      </select>

      <button type="button" onclick="generateImg()">開始生成圖片</button>
      <div id="status">尚未開始</div>
      <div id="result"></div>
    </div>
  </div>

  <script>
    document.getElementById('apiKey').value = localStorage.getItem('poll_key') || '';

    function generateImg() {
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const key = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const model = document.getElementById('model').value;
      const [w, h] = document.getElementById('ratio').value.split('x');

      if (!prompt) {
        status.textContent = '請輸入畫面描述';
        return;
      }

      const seed = Math.floor(Math.random() * 100000);
      const base = `https://gen.pollinations.ai/image/${encodeURIComponent(prompt)}?model=${encodeURIComponent(model)}&width=${w}&height=${h}&seed=${seed}&nologo=true`;
      const finalUrl = key ? ${base}&key=${encodeURIComponent(key)} : base;

      status.textContent = '正在載入圖片...';
      result.innerHTML = '';

      const img = new Image();
      img.onload = () => {
        status.textContent = '生成完成！';
        result.innerHTML = `<img src="${finalUrl}" alt="結果" />`;
      };
      img.onerror = () => {
        status.textContent = '載入失敗（可能是金鑰無效、模型名稱不支援、額度不足或網路連線被擋）。';
      };
      img.src = finalUrl;
    }
  </script>
</body>
</html>
