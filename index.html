<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 視覺創作工作站（乾淨測試版 v3）</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
    }
    label { display: block; color: #94a3b8; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #111827;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    textarea { min-height: 76px; }
    button {
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    #st {
      margin-top: 10px;
      color: #38bdf8;
      font-size: 0.9rem;
      word-break: break-all;
    }
    #pic img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>AI 視覺創作工作站（乾淨測試版 v3）</h2>
    <div class="box">
      <label for="k">Pollinations API Key</label>
      <input id="k" type="text" placeholder="貼上 API Key" />

      <label for="p">畫面描述（英文）</label>
      <textarea id="p">modern city skyline at sunset</textarea>

      <label for="m">模型</label>
      <select id="m">
        <option value="flux">flux</option>
        <option value="zimage">zimage</option>
      </select>

      <label for="r">比例</label>
      <select id="r">
        <option value="1024x576">橫式 16:9 (1024x576)</option>
        <option value="768x1024">直式 3:4 (768x1024)</option>
        <option value="1024x1024">正方形 1:1 (1024x1024)</option>
      </select>

      <button type="button" onclick="runGen()">開始生成圖片</button>
      <div id="st">尚未開始</div>
      <div id="pic"></div>
    </div>
  </div>

  <script>
    function runGen() {
      var st = document.getElementById("st");
      var pic = document.getElementById("pic");
      st.innerHTML = "步驟 1：已點擊按鈕...";
      pic.innerHTML = "";

      var key = document.getElementById("k").value.replace(/^\s+|\s+$/g, "");
      var prompt = document.getElementById("p").value.replace(/^\s+|\s+$/g, "");
      var model = document.getElementById("m").value;
      var dims = document.getElementById("r").value.split("x");
      var seed = Math.floor(Math.random() * 100000);

      if (!prompt) {
        st.innerHTML = "請輸入畫面描述";
        return;
      }

      var url = "https://gen.pollinations.ai/image/" + encodeURIComponent(prompt) +
        "?model=" + encodeURIComponent(model) +
        "&width=" + dims[0] +
        "&height=" + dims[1] +
        "&seed=" + seed +
        "&nologo=true";

      if (key) {
        url = url + "&key=" + encodeURIComponent(key);
      }

      st.innerHTML = "步驟 2：正在請求圖片...";

      var img = new Image();
      img.onload = function () {
        st.innerHTML = "步驟 3：生成完成！";
        pic.innerHTML = '<img src="' + url + '" alt="生成圖片" />';
      };
      img.onerror = function () {
        st.innerHTML = "步驟 3：載入失敗（請檢查金鑰、額度或模型設定）。";
      };
      img.src = url;
    }
  </script>
</body>
</html>
